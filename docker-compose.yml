# Логи Docker без ротации растут бесконечно — ограничиваем 3 файлами по 10 МБ.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  passenger-chat:
    build: .
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
      UPSTASH_REDIS_REST_URL: http://redis-srh:80
      UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN}
      SMSRU_API_ID: ${SMSRU_API_ID}
    networks: [passenger_net]
    # публичных портов нет — доступ только изнутри passenger_net (через nginx opros)
    logging: *logging
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [passenger_net]
    logging: *logging
    mem_limit: 512m
    security_opt: ['no-new-privileges:true']

  redis-srh:
    # закреплено по digest: сторонний образ, :latest мог бы смениться незаметно
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: redis://default:${REDIS_PASSWORD}@redis:6379
    depends_on: [redis]
    networks: [passenger_net]
    logging: *logging
    mem_limit: 256m
    security_opt: ['no-new-privileges:true']

networks:
  passenger_net:
    name: passenger_net

volumes:
  redis-data:
